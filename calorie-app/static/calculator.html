<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>حساب السعرات والماء</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap">
  <div class="nav"><a href="index.html">← الرئيسية</a></div>
  <h1>حساب السعرات والماء</h1>
  <div class="card"><div class="grid">
    <div><label for="sex">الجنس</label><select id="sex"><option value="m">ذكر</option><option value="f">أنثى</option></select></div>
    <div><label for="age">العمر (سنة)</label><input id="age" type="number" inputmode="numeric" placeholder="مثال: 24"></div>
    <div><label for="height">الطول (سم)</label><input id="height" type="number" inputmode="decimal" placeholder="مثال: 175"></div>
    <div><label for="weight">الوزن (كجم)</label><input id="weight" type="number" inputmode="decimal" placeholder="مثال: 80"></div>
    <div class="full"><label for="act">مستوى النشاط</label><select id="act">
      <option value="1.2">قليل الحركة</option><option value="1.375">خفيف (1-3 أيام تمرين)</option>
      <option value="1.55" selected>متوسط (3-5 أيام)</option><option value="1.725">عالٍ (6-7 أيام)</option>
      <option value="1.9">عالٍ جداً</option></select></div>
    <div class="full"><label for="goal">هدفك</label><select id="goal"><option value="lose">تنزيل الوزن</option><option value="keep" selected>تثبيت الوزن</option><option value="gain">زيادة الوزن</option></select></div>
  </div>
  <button class="wide" id="calc">احسب</button><div class="msg" id="msg" role="alert"></div></div>

  <div class="card" id="res" hidden>
    <div class="big"><div class="box"><b id="kcal">0</b><span>سعرة يومياً</span></div><div class="box"><b id="water">0</b><span>لتر ماء يومياً</span></div></div>
    <ul id="det"></ul><div class="note" id="note"></div>
    <button class="wide" id="save">اعتمدها هدفاً في التسجيل</button>
  </div>
  <p class="foot">التقديرات تقريبية للتوعية فقط وليست بديلاً عن استشارة مختص.</p>
</div>
<script src="app.js"></script>
<script>
let last = null;
$("calc").onclick = async () => {
  $("msg").textContent = "";
  try {
    last = await api("/api/calc", "POST", {sex: $("sex").value, age: $("age").value, height: $("height").value,
      weight: $("weight").value, act: $("act").value, goal: $("goal").value});
  } catch (e) { $("res").hidden = true; $("msg").textContent = e.message; return; }
  $("kcal").textContent = fmt(last.kcal);
  $("water").textContent = last.water.toFixed(1);
  $("det").innerHTML = `<li>معدل الحرق الأساسي: ${fmt(last.bmr)} سعرة</li><li>احتياج الحفاظ على الوزن: ${fmt(last.tdee)} سعرة</li>` +
    `<li>بروتين ${last.protein} جم، كربوهيدرات ${last.carbs} جم، دهون ${last.fat} جم</li><li>مؤشر كتلة الجسم: ${last.bmi}</li>`;
  $("note").textContent = last.floored ? `تم رفع الهدف للحد الأدنى الآمن (${fmt(last.floor)} سعرة).` : "زد الماء في الأجواء الحارة أو عند التعرق الكثير.";
  $("res").hidden = false;
};
$("save").onclick = async () => {
  try { await api("/api/goal", "POST", last); location.href = "tracker.html"; }
  catch (e) { $("msg").textContent = e.message; }
};
</script></body></html>
