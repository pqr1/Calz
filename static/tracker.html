<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تسجيل الماكروز</title><link rel="stylesheet" href="style.css"></head>
<body><div class="wrap">
  <div class="nav"><a href="index.html">← الرئيسية</a> · <a href="calculator.html">احسب هدفك</a></div>
  <div class="top">
    <div class="mh"><h2>سعرات اليوم</h2><input id="day" type="date" style="width:auto"></div>
    <div class="count" id="count">0 / 0</div>
    <div class="bar" id="bar"><i></i></div>
    <div class="macros"><div id="mp">P 0/0</div><div id="mc">C 0/0</div><div id="mf">F 0/0</div></div>
    <button class="ghost wide" id="setgoal">تغيير الهدف</button>
    <div id="goalbox" hidden style="margin-top:12px">
      <div class="grid">
        <div class="full"><label for="gw">الماء (لتر)</label><input id="gw" type="number" step="0.1" inputmode="decimal" placeholder="مثال: 3"></div>
        <div class="full"><label for="gk">السعرات اليومية</label><input id="gk" type="number" inputmode="numeric" placeholder="مثال: 2200"></div>
        <div><label for="gp">بروتين (جم)</label><input id="gp" type="number" inputmode="numeric" placeholder="تلقائي"></div>
        <div><label for="gc">كربوهيدرات (جم)</label><input id="gc" type="number" inputmode="numeric" placeholder="تلقائي"></div>
        <div class="full"><label for="gf">دهون (جم)</label><input id="gf" type="number" inputmode="numeric" placeholder="تلقائي"></div>
      </div>
      <p class="sub" style="margin:8px 0 0;font-size:.85rem">اترك أي خانة ماكروز فاضية ويتم توزيعها تلقائياً (30% بروتين، 40% كربوهيدرات، 30% دهون).</p>
      <button class="wide" id="savegoal">حفظ الهدف</button>
    </div>
  </div>
  <div class="msg" id="msg" role="alert"></div>
  <div class="card">
    <div class="mh"><h2>الماء</h2><span id="wtxt" style="font-weight:700;direction:ltr">0 / 2500 مل</span></div>
    <div class="bar" id="wbar"><i></i></div>
    <div class="add" style="grid-template-columns:1fr auto auto"><input id="wml" type="number" inputmode="numeric" placeholder="مل (مثال: 500)"><button id="wadd">+</button><button class="ghost" id="wreset">تصفير</button></div>
  </div>
  <p class="sub" style="font-size:.85rem">الطعام الغير موجود في القائمة: اكتب اسمه وسعراته في الخانة الثالثة.</p>
  <div id="meals"></div>
  <datalist id="fl"></datalist>
</div>
<script src="app.js"></script>
<script>
const MEALS = [["breakfast", "الفطور"], ["lunch", "الغداء"], ["dinner", "العشاء"]];
let foods = [], goal = null, day = today();
const say = (t) => { $("msg").textContent = t || ""; };

MEALS.forEach(([k, t]) => {
  $("meals").insertAdjacentHTML("beforeend", `<section class="card"><div class="mh"><h2>${t}</h2><div style="text-align:left"><span id="s-${k}" class="sub" style="margin:0">0 سعرة</span><br><small id="mm-${k}" dir="ltr" class="sub" style="margin:0">P 0 · C 0 · F 0</small></div></div>
    <ul class="items" id="l-${k}"></ul>
    <div class="add"><input id="n-${k}" list="fl" placeholder="الطعام"><input id="g-${k}" type="number" inputmode="decimal" placeholder="جرام">
    <input id="c-${k}" type="number" inputmode="decimal" placeholder="سعرات"><button data-m="${k}">+</button></div></section>`);
});

async function refresh() {
  const items = await api("/api/log?day=" + day);
  const tot = {kcal: 0, protein: 0, carbs: 0, fat: 0};
  MEALS.forEach(([k]) => {
    const list = items.filter((i) => i.meal === k);
    $("l-" + k).innerHTML = list.map((i) => `<li><span>${esc(i.name)} <small>${i.grams ? fmt(i.grams) + " جم · " : ""}${fmt(i.kcal)} سعرة</small></span><button data-del="${i.id}" aria-label="حذف">×</button></li>`).join("");
    const sum = (m) => list.reduce((s, i) => s + i[m], 0);
    $("s-" + k).textContent = fmt(sum("kcal")) + " سعرة";
    $("mm-" + k).textContent = `P ${fmt(sum("protein"))} · C ${fmt(sum("carbs"))} · F ${fmt(sum("fat"))}`;
  });
  items.forEach((i) => { for (const m in tot) tot[m] += i[m]; });
  const g = goal || {kcal: 0, protein: 0, carbs: 0, fat: 0};
  $("count").textContent = `${fmt(tot.kcal)} / ${fmt(g.kcal)}`;
  const over = g.kcal && tot.kcal > g.kcal;
  $("count").classList.toggle("over", !!over);
  $("bar").classList.toggle("over", !!over);
  $("bar").firstElementChild.style.width = (g.kcal ? Math.min(100, tot.kcal / g.kcal * 100) : 0) + "%";
  $("mp").textContent = `P ${fmt(tot.protein)}/${fmt(g.protein)}`;
  $("mc").textContent = `C ${fmt(tot.carbs)}/${fmt(g.carbs)}`;
  $("mf").textContent = `F ${fmt(tot.fat)}/${fmt(g.fat)}`;
  const w = await api("/api/water?day=" + day), wg = (goal && goal.water) || 2500;
  $("wtxt").textContent = `${fmt(w.ml)} / ${fmt(wg)} مل`;
  $("wbar").firstElementChild.style.width = Math.min(100, w.ml / wg * 100) + "%";
}

async function addItem(m) {
  const name = $("n-" + m).value.trim(), grams = +$("g-" + m).value, kc = +$("c-" + m).value;
  if (!name) return say("اكتب اسم الطعام");
  const food = foods.find((f) => f.name === name);
  const body = {day, meal: m};
  if (food) { if (!(grams > 0)) return say("اكتب الكمية بالجرام"); Object.assign(body, {food: food.id, grams}); }
  else { if (!(kc > 0)) return say("الطعام غير موجود في القائمة، اكتب سعراته"); Object.assign(body, {name, kcal: kc, grams}); }
  try { await api("/api/log", "POST", body); say(); ["n-", "g-", "c-"].forEach((p) => { $(p + m).value = ""; }); await refresh(); }
  catch (e) { say(e.message); }
}

document.addEventListener("click", async (e) => {
  try {
    if (e.target.dataset.m) await addItem(e.target.dataset.m);
    if (e.target.dataset.del) { await api("/api/log/" + e.target.dataset.del, "DELETE"); await refresh(); }
  } catch (err) { say(err.message); }
});
$("wadd").onclick = async () => {
  const ml = +$("wml").value;
  if (!(ml > 0)) return say("اكتب كمية الماء بالمل");
  try { await api("/api/water", "POST", {day, ml}); $("wml").value = ""; say(); await refresh(); } catch (e) { say(e.message); }
};
$("wreset").onclick = async () => {
  try { await api("/api/water?day=" + day, "DELETE"); await refresh(); } catch (e) { say(e.message); }
};
$("day").onchange = () => { day = $("day").value || today(); refresh().catch((e) => say(e.message)); };
$("setgoal").onclick = () => {
  const box = $("goalbox");
  box.hidden = !box.hidden;
  if (!box.hidden && goal) { $("gk").value = Math.round(goal.kcal); $("gp").value = Math.round(goal.protein); $("gc").value = Math.round(goal.carbs); $("gf").value = Math.round(goal.fat); $("gw").value = goal.water ? goal.water / 1000 : ""; }
};
$("savegoal").onclick = async () => {
  try {
    goal = await api("/api/goal", "POST", {kcal: $("gk").value, protein: $("gp").value, carbs: $("gc").value, fat: $("gf").value, water: $("gw").value});
    $("goalbox").hidden = true; say(); await refresh();
  } catch (e) { say(e.message); }
};

(async () => {
  $("day").value = day;
  try {
    foods = await api("/api/foods");
    $("fl").innerHTML = foods.map((f) => `<option value="${esc(f.name)}">`).join("");
    goal = await api("/api/goal");
    if (!goal) { say("لم تحدد هدفك بعد. اكتب سعراتك أدناه أو احسبها من صفحة الحساب."); $("goalbox").hidden = false; }
    await refresh();
  } catch (e) { say(e.message); }
})();
</script></body></html>
